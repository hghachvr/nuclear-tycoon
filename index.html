<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nuclear Tycoon</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070a07;--panel:#0d130d;--border:#1a3a1a;--green:#00ff88;
  --green2:#00cc66;--green3:#008844;--dim:#2a4a2a;--text:#4a8a4a;
  --amber:#ffaa00;--purple:#aa44ff;--red:#ff4444;--blue:#44aaff;
}
html,body{background:var(--bg);min-height:100vh;overflow-x:hidden;}
body{font-family:'Share Tech Mono',monospace;color:var(--green);padding:8px;padding-bottom:40px;}

/* HUD */
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.hud-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 8px;text-align:center;}
.hud-label{font-size:9px;color:var(--text);letter-spacing:2px;}
.hud-val{font-size:18px;color:var(--green);font-family:'Orbitron',monospace;font-weight:700;margin-top:3px;word-break:break-all;}
.hud-rate{font-size:10px;color:var(--green3);margin-top:2px;}

/* Title bar */
.titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;}
.game-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:3px;color:var(--green);}
.rebirth-badge{background:#1a0a2a;border:1px solid #6622aa;border-radius:10px;padding:2px 8px;font-size:10px;color:#cc88ff;display:none;}

/* Resources */
.section-title{font-size:10px;color:var(--text);letter-spacing:2px;margin-bottom:6px;padding-left:2px;}
.resources-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.res-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 4px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;overflow:hidden;}
.res-card:active{transform:scale(.96);}
.res-card.active{border-color:var(--green);}
.res-card.locked{opacity:.3;cursor:default;}
.res-card.can-buy{border-color:var(--amber);}
.res-icon{font-size:22px;line-height:1;}
.res-name{font-size:8px;letter-spacing:1px;margin-top:3px;}
.res-count{font-size:10px;color:var(--green);margin-top:2px;}
.res-rate{font-size:9px;color:var(--green3);}
.res-cost{font-size:9px;color:var(--amber);margin-top:2px;}
.res-lock{font-size:8px;color:var(--dim);margin-top:2px;}
.mini-bar{height:3px;background:var(--dim);border-radius:2px;margin-top:4px;overflow:hidden;}
.mini-fill{height:100%;background:var(--green3);border-radius:2px;transition:width .3s;}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:8px;}
.tab{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:8px 4px;text-align:center;font-size:9px;letter-spacing:1px;cursor:pointer;color:var(--text);font-family:'Share Tech Mono',monospace;}
.tab.active{border-color:var(--green);color:var(--green);background:#0d1a0d;}

/* Upgrades */
.upg-list{display:flex;flex-direction:column;gap:6px;}
.upg-btn{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;transition:all .15s;text-align:left;width:100%;font-family:'Share Tech Mono',monospace;}
.upg-btn:active{transform:scale(.98);}
.upg-btn.affordable{border-color:var(--green2);}
.upg-btn.bought{border-color:#111;opacity:.4;cursor:default;}
.upg-name{font-size:11px;color:var(--green);}
.upg-desc{font-size:10px;color:var(--text);margin-top:2px;line-height:1.4;}
.upg-cost{font-size:10px;color:var(--amber);margin-top:4px;}
.upg-empty{font-size:11px;color:var(--dim);text-align:center;padding:20px 0;line-height:1.8;}

/* Research */
.research-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.res-research{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;transition:border-color .15s;}
.res-research:active{transform:scale(.97);}
.res-research.affordable{border-color:var(--amber);}
.res-research.done{border-color:#111;opacity:.5;cursor:default;}
.rr-name{font-size:10px;color:var(--green);}
.rr-eff{font-size:10px;color:var(--amber);margin-top:3px;}
.rr-cost{font-size:9px;color:var(--text);margin-top:4px;}

/* Rebirth */
.rebirth-panel{background:#0a070f;border:1px solid #3a1a5a;border-radius:8px;padding:12px;}
.rebirth-header{font-family:'Orbitron',monospace;font-size:12px;color:#aa44ff;letter-spacing:2px;margin-bottom:10px;}
.rebirth-info{font-size:11px;color:#7744aa;line-height:1.8;margin-bottom:12px;}
.rebirth-info span{color:#cc88ff;}
.rebirth-btn{background:#0f0a1a;border:2px solid #6622aa;border-radius:6px;padding:12px;width:100%;cursor:pointer;color:#cc88ff;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;transition:all .2s;}
.rebirth-btn:active{transform:scale(.97);}
.rebirth-btn.ready{border-color:#aa44ff;color:#ff88ff;background:#150a25;}
.rebirth-progress{height:6px;background:#1a0a2a;border-radius:3px;margin:10px 0;overflow:hidden;}
.rebirth-prog-fill{height:100%;background:linear-gradient(90deg,#6622aa,#aa44ff);border-radius:3px;transition:width .3s;}
.rebirth-history{font-size:10px;color:#5533aa;margin-top:10px;line-height:1.7;}

/* Notification */
.notif{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#001a0d;border:1px solid var(--green);border-radius:20px;padding:6px 16px;font-size:11px;color:var(--green);pointer-events:none;opacity:0;transition:opacity .3s;z-index:100;white-space:nowrap;max-width:90vw;}

/* Ticker */
.ticker{font-size:9px;color:var(--dim);text-align:center;margin-top:10px;letter-spacing:1px;animation:blink 3s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}

/* Scanline overlay */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,.015) 2px,rgba(0,255,136,.015) 4px);pointer-events:none;z-index:0;}
body>*{position:relative;z-index:1;}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<div class="titlebar">
  <div class="game-title">⚛ NUCLEAR TYCOON</div>
  <div style="display:flex;align-items:center;gap:6px;">
    <div class="rebirth-badge" id="rbadge"></div>
    <button onclick="saveGame();notify('💾 Guardado!')" style="background:#0d1a0d;border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 7px;cursor:pointer;letter-spacing:1px;">GUARDAR</button>
    <button onclick="resetGame()" style="background:#1a0d0d;border:1px solid #3a1a1a;border-radius:4px;color:#664444;font-family:'Share Tech Mono',monospace;font-size:9px;padding:3px 7px;cursor:pointer;letter-spacing:1px;">RESET</button>
  </div>
</div>

<div class="hud">
  <div class="hud-box">
    <div class="hud-label">CRÉDITOS</div>
    <div class="hud-val" id="hud-money">$0</div>
    <div class="hud-rate" id="hud-rate">+$0/s</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">ENERGÍA</div>
    <div class="hud-val" id="hud-energy">0 MW</div>
    <div class="hud-rate" id="hud-erate">+0/s</div>
  </div>
</div>

<div class="section-title">FUENTES DE ENERGÍA</div>
<div class="resources-grid" id="res-grid"></div>

<div class="tabs">
  <div class="tab active" id="tab-upg" onclick="showTab('upg')">MEJORAS</div>
  <div class="tab" id="tab-res" onclick="showTab('res')">INVESTIGACIÓN</div>
  <div class="tab" id="tab-reb" onclick="showTab('reb')">⬡ REBIRTH</div>
</div>

<div id="view-upg">
  <div class="section-title">UPGRADES DISPONIBLES</div>
  <div class="upg-list" id="upg-list"></div>
</div>
<div id="view-res" style="display:none">
  <div class="section-title">LAB DE INVESTIGACIÓN NUCLEAR</div>
  <div class="research-grid" id="research-grid"></div>
</div>
<div id="view-reb" style="display:none">
  <div class="rebirth-panel">
    <div class="rebirth-header">⬡ PROTOCOLO REBIRTH</div>
    <div class="rebirth-info" id="reb-info"></div>
    <div class="rebirth-progress"><div class="rebirth-prog-fill" id="reb-prog" style="width:0%"></div></div>
    <button class="rebirth-btn" id="reb-btn" onclick="doRebirth()">INICIAR REBIRTH</button>
    <div class="rebirth-history" id="reb-hist"></div>
  </div>
</div>

<div class="ticker" id="ticker">Inicializando reactor principal...</div>

<script>
const REBIRTH_COST = 50000;

const FMT = n => {
  if(n>=1e15) return '$'+(n/1e15).toFixed(2)+'Q';
  if(n>=1e12) return '$'+(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return '$'+(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return '$'+(n/1e3).toFixed(1)+'K';
  return '$'+Math.floor(n);
};
const FMTN = n => {
  if(n>=1e9)  return (n/1e9).toFixed(1)+'B';
  if(n>=1e6)  return (n/1e6).toFixed(1)+'M';
  if(n>=1e3)  return (n/1e3).toFixed(1)+'K';
  return Math.floor(n)+'';
};

const RESOURCES = [
  {id:'uranium',   name:'URANIO',   icon:'⚛',  base:1,    baseCost:10,    unlockAt:0,      desc:'U-235 enriquecido'},
  {id:'plutonium', name:'PLUT.',    icon:'☢',  base:6,    baseCost:500,   unlockAt:200,    desc:'Pu-239 generado'},
  {id:'thorium',   name:'TORIO',   icon:'⬡',  base:18,   baseCost:5000,  unlockAt:2000,   desc:'Ciclo Th-232'},
  {id:'fusion',    name:'FUSIÓN',  icon:'✦',  base:60,   baseCost:50000, unlockAt:20000,  desc:'Plasma D-T'},
  {id:'antimatter',name:'ANTIMAT.',icon:'⊕',  base:300,  baseCost:1e6,   unlockAt:500000, desc:'Antiprotones'},
  {id:'darkfuel',  name:'OSCURO',  icon:'◈',  base:3000, baseCost:1e8,   unlockAt:1e7,    desc:'Energía oscura'},
];

const UPGRADES = [
  {id:'u1', name:'Varillas de control',      desc:'Estabiliza el reactor principal',         cost:100,    eff:()=>{G.rm.uranium*=2},       req:()=>G.earned>=50},
  {id:'u2', name:'Centrífuga avanzada',      desc:'Enriquecimiento al 20% U-235',            cost:800,    eff:()=>{G.rm.uranium*=3},        req:()=>G.earned>=400},
  {id:'u3', name:'Agua pesada D₂O',          desc:'Moderador de neutrones mejorado',         cost:5000,   eff:()=>{G.rm.uranium*=4;G.rm.plutonium*=2}, req:()=>G.earned>=2000},
  {id:'u4', name:'Ciclo de combustible',     desc:'Reciclaje de material fisionable',        cost:25000,  eff:()=>{G.rm.plutonium*=4},      req:()=>G.earned>=10000},
  {id:'u5', name:'Blanket de torio',         desc:'Manto reproductor Th-232→U-233',          cost:100000, eff:()=>{G.rm.thorium*=3},        req:()=>G.earned>=50000},
  {id:'u6', name:'Plasma confinado',         desc:'Tokamak: confinamiento magnético',        cost:500000, eff:()=>{G.rm.fusion*=3},         req:()=>G.earned>=200000},
  {id:'u7', name:'Superconductores HTS',     desc:'Magnetos de alta temperatura crítica',    cost:2e6,    eff:()=>{G.rm.fusion*=5;G.rm.thorium*=2}, req:()=>G.earned>=1e6},
  {id:'u8', name:'Trampa de Penning',        desc:'Campo magnético para antimateria',        cost:2e7,    eff:()=>{G.rm.antimatter*=3},     req:()=>G.earned>=1e7},
  {id:'u9', name:'Colisionador cuántico',    desc:'Producción masiva de antiprotones',       cost:2e8,    eff:()=>{G.rm.antimatter*=6},     req:()=>G.earned>=1e8},
  {id:'u10',name:'Singularidad oscura',      desc:'Aprovecha la energía del vacío cuántico', cost:2e9,    eff:()=>{G.rm.darkfuel*=5;G.gm*=2}, req:()=>G.earned>=1e9},
  {id:'u11',name:'Reacción en cadena',       desc:'Fisión autocatalítica controlada',        cost:1e4,    eff:()=>{G.gm*=1.5},              req:()=>G.earned>=5000},
  {id:'u12',name:'Ley de Coulomb nuclear',   desc:'Reducción de barrera de fusión',          cost:5e5,    eff:()=>{G.gm*=2},                req:()=>G.earned>=300000},
];

const RESEARCH = [
  {id:'r1', name:'Fisión controlada',   eff:'+20% U/Pu',        cost:300,    fx:()=>{G.rm.uranium*=1.2;G.rm.plutonium*=1.2}},
  {id:'r2', name:'Decaimiento beta',    eff:'+30% todo',        cost:2000,   fx:()=>{G.gm*=1.3}},
  {id:'r3', name:'Espectroscopía γ',    eff:'+50% Torio',       cost:10000,  fx:()=>{G.rm.thorium*=1.5}},
  {id:'r4', name:'Inyección pellets',   eff:'+2x Fusión',       cost:80000,  fx:()=>{G.rm.fusion*=2}},
  {id:'r5', name:'Ley de Faraday',      eff:'+40% global',      cost:300000, fx:()=>{G.gm*=1.4}},
  {id:'r6', name:'Maxwell unificado',   eff:'+2x global',       cost:2e6,    fx:()=>{G.gm*=2}},
  {id:'r7', name:'Antimat. estable',    eff:'+3x Antimat.',     cost:2e7,    fx:()=>{G.rm.antimatter*=3}},
  {id:'r8', name:'Gravedad cuántica',   eff:'+5x Oscuro',       cost:5e8,    fx:()=>{G.rm.darkfuel*=5}},
  {id:'r9', name:'Cámara de burbujas',  eff:'+25% global',      cost:500,    fx:()=>{G.gm*=1.25}},
  {id:'r10',name:'Neutrinos lentos',    eff:'+60% U+Pu',        cost:20000,  fx:()=>{G.rm.uranium*=1.6;G.rm.plutonium*=1.6}},
];

const TICKERS = [
  'Reactor N°1 operando al 98.3%...','Temperatura núcleo: 15.000.000 °C...','Neutrones térmicos en rango nominal...','Enriquecimiento U-235: 3.7%...','Circuito de refrigeración primario activo...','Red eléctrica sincronizada a 50 Hz...','Barras de control en posición óptima...','Monitor Geiger-Müller: niveles normales...','Sistema de seguridad SCRAM listo...','Turbinas de vapor girando a 3000 rpm...','Presión del vapor: 70 bar nominal...','Agua pesada: temperatura 285°C...',
];

// Game state
let G = {
  money:0, earned:0, energy:0,
  rebirths:0, rbMult:1,
  rm:{uranium:1,plutonium:1,thorium:1,fusion:1,antimatter:1,darkfuel:1},
  gm:1,
  owned:{uranium:1,plutonium:0,thorium:0,fusion:0,antimatter:0,darkfuel:0},
  upgBought:[],
  resDone:[],
  lastSave: Date.now(),
};

const SAVE_KEY = 'nuclear_tycoon_v1';

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({...G, lastSave: Date.now()}));
  }catch(e){}
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    // Merge saved into G safely
    G.money    = saved.money    || 0;
    G.earned   = saved.earned   || 0;
    G.energy   = saved.energy   || 0;
    G.rebirths = saved.rebirths || 0;
    G.rbMult   = saved.rbMult   || 1;
    G.gm       = saved.gm       || 1;
    G.rm       = Object.assign({uranium:1,plutonium:1,thorium:1,fusion:1,antimatter:1,darkfuel:1}, saved.rm||{});
    G.owned    = Object.assign({uranium:1,plutonium:0,thorium:0,fusion:0,antimatter:0,darkfuel:0}, saved.owned||{});
    G.upgBought = saved.upgBought || [];
    G.resDone   = saved.resDone   || [];
    G.lastSave  = saved.lastSave  || Date.now();

    // Re-apply upgrades effects so multipliers are correct
    G.rm = {uranium:1,plutonium:1,thorium:1,fusion:1,antimatter:1,darkfuel:1};
    G.gm = 1;
    G.upgBought.forEach(id=>{
      const u = UPGRADES.find(x=>x.id===id);
      if(u) u.eff();
    });
    G.resDone.forEach(id=>{
      const r = RESEARCH.find(x=>x.id===id);
      if(r) r.fx();
    });

    // Offline earnings (max 4 hours)
    const offlineSecs = Math.min((Date.now() - G.lastSave) / 1000, 4*3600);
    if(offlineSecs > 10){
      const offlineIncome = totalRate() * offlineSecs;
      G.money  += offlineIncome;
      G.earned += offlineIncome;
      setTimeout(()=>notify('⏱ Offline: +'+FMT(offlineIncome)+' ganados'), 800);
    }
  }catch(e){}
}

function resetGame(){
  if(!confirm('¿Borrar TODO el progreso? Esta acción no se puede deshacer.')) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

function rate(id){
  const r=RESOURCES.find(x=>x.id===id);
  return r.base*(G.owned[id]||0)*(G.rm[id]||1)*G.gm*G.rbMult;
}
function totalRate(){return RESOURCES.reduce((s,r)=>s+rate(r.id),0);}
function totalEnergy(){return RESOURCES.reduce((s,r)=>s+rate(r.id)*r.base*0.04,0);}
function nextCost(r){
  const o=G.owned[r.id]||0;
  return o===0?r.baseCost:r.baseCost*Math.pow(1.15,o);
}

let lastTick=Date.now();
function tick(){
  const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;
  const inc=totalRate()*dt;
  G.money+=inc;G.earned+=inc;G.energy+=totalEnergy()*dt;
  document.getElementById('hud-money').textContent=FMT(G.money);
  document.getElementById('hud-rate').textContent='+'+FMT(totalRate())+'/s';
  document.getElementById('hud-energy').textContent=FMTN(G.energy)+' MW';
  document.getElementById('hud-erate').textContent='+'+FMTN(totalEnergy())+'/s';
}

function buyRes(id){
  const r=RESOURCES.find(x=>x.id===id);
  if(!r)return;
  const cost=nextCost(r);
  if(G.money<cost)return;
  G.money-=cost;
  G.owned[id]=(G.owned[id]||0)+1;
  notify('+1 '+r.name);
  renderResGrid();
  renderUpgrades();
}

function buyUpg(id){
  const u=UPGRADES.find(x=>x.id===id);
  if(!u||G.upgBought.includes(id))return;
  if(G.money<u.cost)return;
  G.money-=u.cost;G.upgBought.push(id);u.eff();
  notify(u.name+' activado ✓');
  renderUpgrades();
}

function buyResearch(id){
  const r=RESEARCH.find(x=>x.id===id);
  if(!r||G.resDone.includes(id))return;
  if(G.money<r.cost)return;
  G.money-=r.cost;G.resDone.push(id);r.fx();
  notify('Investigación: '+r.name);
  renderResearch();
}

function doRebirth(){
  if(G.earned<REBIRTH_COST){notify('Necesitás '+FMT(REBIRTH_COST)+' para Rebirth');return;}
  const bonus=1+(G.rebirths*0.5+0.5);
  G.rebirths++;G.rbMult*=bonus;
  G.money=0;G.earned=0;G.energy=0;
  G.rm={uranium:1,plutonium:1,thorium:1,fusion:1,antimatter:1,darkfuel:1};
  G.gm=1;G.upgBought=[];G.resDone=[];
  G.owned={uranium:1,plutonium:0,thorium:0,fusion:0,antimatter:0,darkfuel:0};
  notify('⬡ REBIRTH! Multiplicador x'+bonus.toFixed(1)+' aplicado');
  renderAll();renderRebirth();
}

function renderResGrid(){
  const el=document.getElementById('res-grid');
  el.innerHTML=RESOURCES.map(r=>{
    const owned=G.owned[r.id]||0;
    const locked=G.earned<r.unlockAt&&owned===0;
    const cost=nextCost(r);
    const canBuy=G.money>=cost&&!locked;
    const rateVal=rate(r.id);
    const pct=r.unlockAt>0?Math.min(100,G.earned/r.unlockAt*100):100;
    let cls='res-card'+(locked?' locked':owned>0?' active':canBuy?' can-buy':'');
    return `<div class="${cls}" onclick="${locked?'':'buyRes(\''+r.id+'\')'} ">
      <div class="res-icon">${r.icon}</div>
      <div class="res-name">${r.name}</div>
      ${owned>0?`<div class="res-count">x${owned}</div><div class="res-rate">${FMTN(rateVal)}/s</div>`:''}
      ${!locked&&owned===0?`<div class="res-cost">${FMT(cost)}</div>`:''}
      ${locked?`<div class="res-lock">BLOQ</div><div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>`:''}
    </div>`;
  }).join('');
}

function renderUpgrades(){
  const el=document.getElementById('upg-list');
  const avail=UPGRADES.filter(u=>!G.upgBought.includes(u.id)&&u.req());
  if(!avail.length){
    el.innerHTML='<div class="upg-empty">Seguí generando energía<br>para desbloquear más mejoras<br><br>Ganado: '+FMT(G.earned)+'</div>';
    return;
  }
  el.innerHTML=avail.map(u=>{
    const can=G.money>=u.cost;
    return `<button class="upg-btn ${can?'affordable':''}" onclick="buyUpg('${u.id}')">
      <div class="upg-name">${u.name}</div>
      <div class="upg-desc">${u.desc}</div>
      <div class="upg-cost">Costo: ${FMT(u.cost)}</div>
    </button>`;
  }).join('');
}

function renderResearch(){
  const el=document.getElementById('research-grid');
  el.innerHTML=RESEARCH.map(r=>{
    const done=G.resDone.includes(r.id);
    const can=G.money>=r.cost&&!done;
    return `<div class="res-research ${done?'done':can?'affordable':''}" onclick="${done?'':'buyResearch(\''+r.id+'\')'} ">
      <div class="rr-name">${r.name}</div>
      <div class="rr-eff">${r.eff}</div>
      <div class="rr-cost">${done?'✓ COMPLETADO':FMT(r.cost)}</div>
    </div>`;
  }).join('');
}

function renderRebirth(){
  const can=G.earned>=REBIRTH_COST;
  const pct=Math.min(100,G.earned/REBIRTH_COST*100);
  const next=1+(G.rebirths*0.5+0.5);
  document.getElementById('reb-info').innerHTML=
    `Reiniciás el juego ganando un multiplicador PERMANENTE.<br>
    Multiplicador actual: <span>x${G.rbMult.toFixed(2)}</span><br>
    Próximo bonus: <span>x${next.toFixed(1)}</span><br>
    Progreso: <span>${FMT(G.earned)} / ${FMT(REBIRTH_COST)}</span>`;
  document.getElementById('reb-prog').style.width=pct+'%';
  const btn=document.getElementById('reb-btn');
  btn.className='rebirth-btn'+(can?' ready':'');
  btn.textContent=can?`⬡ HACER REBIRTH (x${next.toFixed(1)})`:(`⬡ REBIRTH — faltan ${FMT(REBIRTH_COST-G.earned)}`);
  document.getElementById('reb-hist').innerHTML=G.rebirths>0?
    `Rebirths: <span style="color:#cc88ff">${G.rebirths}</span> | Mult. total: <span style="color:#ff88ff">x${G.rbMult.toFixed(2)}</span>`:'';
  const badge=document.getElementById('rbadge');
  if(G.rebirths>0){badge.style.display='inline-block';badge.textContent='⬡ x'+G.rebirths;}
  else badge.style.display='none';
}

function showTab(t){
  ['upg','res','reb'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===t?'block':'none';
    document.getElementById('tab-'+id).className='tab'+(id===t?' active':'');
  });
  if(t==='reb')renderRebirth();
  if(t==='res')renderResearch();
  if(t==='upg')renderUpgrades();
}

let ntimer;
function notify(msg){
  const el=document.getElementById('notif');
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(ntimer);ntimer=setTimeout(()=>el.style.opacity='0',2000);
}

let tickerIdx=0;
setInterval(()=>{
  document.getElementById('ticker').textContent=TICKERS[tickerIdx%TICKERS.length];
  tickerIdx++;
},4500);

function renderAll(){renderResGrid();renderUpgrades();renderResearch();}

loadGame();
setInterval(tick,80);
setInterval(renderAll,900);
setInterval(saveGame,15000);
renderAll();
setTimeout(()=>notify('💾 Partida cargada'),600);
</script>
</body>
</html>
